# Default values for cloudflare-tunnel.

# Cloudflare parameters.
cloudflare:
  # Your Cloudflare account number.
  account: ""
  # The name of the tunnel this instance will serve
  tunnelName: ""
  # The ID of the above tunnel.
  tunnelId: ""
  # The secret for the tunnel.
  secret: ""
  # If defined, no secret is created for the credentials, and instead, the secret referenced is used
  secretName: null
  # If true, turn on WARP routing for TCP
  enableWarp: false
  # Define ingress rules for the tunnel. See
  # https://developers.cloudflare.com/cloudflare-one/connections/connect-apps/configuration/configuration-file/ingress
  ingress: []
    # The first rule proxies traffic to the httpbin sample service named web-server at port 80
    # - hostname: tunnel.example.com
    #  service: http://web-service:80
    # This rule sends traffic to the built-in hello-world HTTP server. This can help debug connectivity
    # issues. If hello.example.com resolves and tunnel.example.com does not, then the problem is
    # in the connection from cloudflared to your local service, not from the internet to cloudflared.
    # - hostname: hello.example.com
    #   service: hello_world
    #
    #
  # Specifies the protocol used to establish a connection between cloudflared
  # and the Cloudflare global network. Available values are auto, http2, h2mux,
  # and quic. (default: auto)
  # https://developers.cloudflare.com/cloudflare-one/connections/connect-apps/install-and-setup/tunnel-guide/local/local-management/arguments/
  protocol: ""
image:
  repository: cloudflare/cloudflared
  pullPolicy: IfNotPresent
  # If supplied, this overrides "appVersion"
  tag: ""

replicaCount: 2

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

# Security items common to everything in the pod.  Here we require that it
# does not run as the user defined in the image, literally named "nonroot".
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

# Security items for one container. We lock it down.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

# Cloudflared has a /ready endpoint which returns 200 if and only if it has an
# active connection to the edge. cloudflared reconnects to the edge by itself,
# so a short edge disconnect must not restart the pod: failing on the first
# probe restarted all replicas at once during a 2 second edge blip.
livenessProbe:
  httpGet:
    path: /ready
    port: 2000
  failureThreshold: 6
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5

# Readiness only gates rollouts and PDB accounting (no Service routes to these
# pods); traffic arrives over the edge connections. Together with
# minReadySeconds and the strategy below, a rollout replaces one pod at a time
# and waits until the new pod is connected to the edge, instead of replacing
# all replicas at once.
readinessProbe:
  httpGet:
    path: /ready
    port: 2000
  failureThreshold: 3
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5

# Seconds a new pod must stay ready before the rollout continues.
minReadySeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Limit voluntary disruptions (node drains, upgrades), so they can't take down
# all tunnel replicas at once. maxUnavailable: 1 never blocks a drain, even
# with a single replica; minAvailable can, and takes precedence when set.
# Note: a PDB does not affect Deployment rolling updates.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  # minAvailable: 2

nodeSelector: {}

tolerations: []

# Default affinity is to spread out over nodes; use this to override.
affinity: {}
